<!DOCTYPE html>
<html lang="nl-NL">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Is Het Al Donderdag?</title>
  <meta name="description" content="Wil je weten of het al donderdag is?" />
  <meta name="color-scheme" content="light dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@700&display=swap&text=JaNe.!?IshtlondrgAHi" />
  <link id="g-print-style" rel="stylesheet" media="print" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@700&display=swap&text=JaNe.!?IshtlondrgAHi" />
  <script async nonce="{{ nonce }}">
    const link = document.getElementById('g-print-style');
    link.addEventListener('load', () => (link.media = 'all'));
  </script>
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@700&display=swap&text=JaNe.!?IshtlondrgAHi" />
  </noscript>
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png" />
  <link rel="mask-icon" href="/images/safari-pinned-tab.svg" color="#5bbad5" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="msapplication-TileColor" content="#da532c" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="stylesheet" href="/static/css/main.css" nonce="{{ nonce }}">
  <script src="/static/js/main.js" async nonce="{{ nonce }}"></script>
</head>

<body>
  <main>
    <h1>Is het al donderdag?</h1>
    <h2 class="{{ 'active' if is_thursday else 'inactive' }}">
      {{ 'Ja!' if is_thursday else 'Nee.' }}
    </h2>
  </main>
</body>

</html>
